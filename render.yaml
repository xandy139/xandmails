services:
  - type: web
    name: xandmails
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: POLL_INTERVAL
        value: "10"
      - key: CODE_EXPIRATION_MINUTES
        value: "15"
